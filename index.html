<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Archive Cycle</title>
<style>
    @font-face { font-family: 'font'; src: url('original/fonts/font.otf') format('opentype'); font-display: block; }
    @font-face { font-family: 'font2'; src: url('original/fonts/font2.otf') format('opentype'); font-display: block; }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
        background: radial-gradient(ellipse 70% 60% at 50% 40%, #151715, #050505 75%);
        color: #e9e7de; font-family: 'font2', serif; padding: 40px 16px;
    }
    main { width: min(560px, 100%); }
    h1 { font-family: 'font'; font-weight: normal; text-transform: uppercase; font-size: clamp(1.6rem, 5vw, 2.4rem); margin: 0 0 6px; filter: url(#ink); }
    p.sub { margin: 0 0 28px; letter-spacing: .3em; text-transform: uppercase; font-size: .75rem; color: rgba(233,231,222,.45); }
    ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    a {
        display: grid; grid-template-columns: 3.2em 1fr auto; align-items: baseline; gap: 12px;
        padding: 16px 18px; color: inherit; text-decoration: none; background: #6e706a; color: #0b0c0a;
        clip-path: polygon(0.6% 4%, 30% 1%, 70% 3%, 99.4% 1.5%, 99% 50%, 99.6% 97%, 60% 99%, 25% 97.5%, 0.4% 99%, 1% 50%);
        transition: transform .25s ease, background .25s ease;
    }
    a:hover, a:focus-visible { transform: translateX(6px); background: #8a8c85; outline: none; }
    .n { font-family: 'font'; font-size: 1.3rem; }
    .t { font-weight: 700; font-size: 1.15rem; }
    .w { font-size: .8rem; letter-spacing: .18em; text-transform: uppercase; opacity: .65; }
    .grain { position: fixed; inset: 0; pointer-events: none; opacity: .17; background: url('original/images/noise.gif'); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="ink"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="9"/><feDisplacementMap in="SourceGraphic" scale="1.2"/></filter></svg>
<main>
    <h1>The Archive Cycle</h1>
    <p class="sub">one player, five worlds</p>
    <ol>
        <li><a href="original/"><span class="n">I</span><span class="t">The Arcane Archive</span><span class="w">the original</span></a></li>
        <li><a href="mossbound/"><span class="n">II</span><span class="t">The Mossbound Codex</span><span class="w">forest</span></a></li>
        <li><a href="dungeon/"><span class="n">III</span><span class="t" data-slot="dungeon">The Undercroft Ledger</span><span class="w">dungeon</span></a></li>
        <li><a href="crystal/"><span class="n">IV</span><span class="t" data-slot="crystal">The Geode Psalter</span><span class="w">crystal cave</span></a></li>
        <li><a href="town/"><span class="n">V</span><span class="t" data-slot="town">The Belfry Almanac</span><span class="w">town</span></a></li>
    </ol>
</main>
<div class="grain"></div>
</body>
</html>
